<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;900&display=swap');
        
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #f43f5e;
            --dark: #1e293b;
            --light: #f8fafc;
            --gray: #94a3b8;
            --success: #10b981;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .splash-container {
            text-align: center;
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 900px;
            padding: 2rem;
        }
        
        .logo-container {
            height: 120px;
            margin-bottom: 2rem;
            position: relative;
            display: flex;
            justify-content: center;
        }
        
        .logo {
            font-size: 6rem;
            font-weight: 900;
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
        }
        
        .logo-version {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            font-size: 6rem;
            font-weight: 900;
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            opacity: 0;
        }
        
        .logo-letter {
            display: inline-block;
            position: relative;
            color: transparent;
            -webkit-text-stroke: 2px var(--primary);
            animation: float 3s ease-in-out infinite;
        }
        
        .logo-letter.filled::before {
            content: attr(data-letter);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            color: var(--primary);
        }
        
        .tagline {
            font-size: 1.5rem;
            margin-bottom: 3rem;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 1s ease-out 2s forwards;
        }
        
        .cta-button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 1rem 2.5rem;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            z-index: 1;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 1s ease-out 2.5s forwards;
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
        }
        
        .cta-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: 0.5s;
            z-index: -1;
        }
        
        .cta-button:hover::before {
            left: 100%;
        }
        
        .loading-bar {
            width: 0;
            height: 4px;
            background: var(--primary);
            position: absolute;
            bottom: 0;
            left: 0;
            animation: loading 3s ease-out forwards;
        }
        
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        
        .particle {
            position: absolute;
            background: var(--primary);
            border-radius: 50%;
            opacity: 0;
            animation: particle-float 5s infinite ease-in-out;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes loading {
            from { width: 0; }
            to { width: 100%; }
        }
        
        @keyframes particle-float {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-500px) rotate(360deg); opacity: 0; }
        }
        
        @keyframes logoMorphIn {
            0% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
            100% { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        
        @keyframes logoMorphOut {
            0% { opacity: 1; transform: translateX(-50%) translateY(0); }
            100% { opacity: 0; transform: translateX(-50%) translateY(20px); }
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .logo, .logo-version {
                font-size: 4rem;
            }
            
            .tagline {
                font-size: 1.2rem;
            }
            
            .logo-container {
                height: 90px;
            }
        }
        
        @media (max-width: 480px) {
            .logo, .logo-version {
                font-size: 2.5rem;
                gap: 0.25rem;
            }
            
            .tagline {
                font-size: 1rem;
            }
            
            .cta-button {
                padding: 0.8rem 2rem;
                font-size: 1rem;
            }
            
            .logo-container {
                height: 60px;
            }
        }
    </style>
</head>

    <script>
        // Create particles
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = 30;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                
                // Random size between 2px and 6px
                const size = Math.random() * 4 + 2;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                
                // Random position
                particle.style.left = `${Math.random() * 100}%`;
                particle.style.bottom = `-${size}px`;
                
                // Random animation duration and delay
                const duration = Math.random() * 5 + 5;
                const delay = Math.random() * 5;
                particle.style.animationDuration = `${duration}s`;
                particle.style.animationDelay = `${delay}s`;
                
                // Random color variation
                const hue = 240 + Math.random() * 20 - 10;
                particle.style.backgroundColor = `hsl(${hue}, 90%, 65%)`;
                
                particlesContainer.appendChild(particle);
            }
        }
        
        // Initialize particles
        createParticles();
        
        // Button click handler
        document.getElementById('enterButton').addEventListener('click', function() {
            // Add ripple effect
            const ripple = document.createElement('span');
            ripple.classList.add('ripple');
            this.appendChild(ripple);
            
            // Remove ripple after animation
            setTimeout(() => {
                ripple.remove();
            }, 600);
            
            // Redirect after animation
            setTimeout(() => {
                window.location.href = 'dashboard.html'; // Change to your actual dashboard page
            }, 1000);
        });
        
        // Logo morphing animation
        const logoVersions = [
            'mainLogo',
            'tiffVersion', 'rawVersion', 'pngVersion',
            'mp4Version', 'movVersion',
            'mp3Version', 'wavVersion',
            'pdfVersion', 'docxVersion'
        ];
        
        let currentVersion = 0;
        
        function morphLogo() {
            // Hide current version
            const currentLogo = document.getElementById(logoVersions[currentVersion]);
            currentLogo.style.animation = 'logoMorphOut 0.5s forwards';
            
            // Calculate next version (loop back to 0 after last)
            currentVersion = (currentVersion + 1) % logoVersions.length;
            
            // Show next version
            const nextLogo = document.getElementById(logoVersions[currentVersion]);
            nextLogo.style.animation = 'logoMorphIn 0.5s forwards';
            
            // Schedule next morph
            setTimeout(morphLogo, 2000); // Change every 2 seconds
        }
        
        // Start morphing after initial animation
        setTimeout(morphLogo, 3000);
        
        // Add styles for ripple effect
        const style = document.createElement('style');
        style.textContent = `
            .ripple {
                position: absolute;
                border-radius: 50%;
                background-color: rgba(255, 255, 255, 0.7);
                transform: scale(0);
                animation: ripple 0.6s linear;
                pointer-events: none;
            }
            
            @keyframes ripple {
                to {
                    transform: scale(4);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);
    </script>
